name: Revenue model checks

on:
  push:
    paths:
      - "projects/sme-revenue-operations-blueprint/analytics/**"
      - ".github/workflows/revenue-model-tests.yml"
  pull_request:
    paths:
      - "projects/sme-revenue-operations-blueprint/analytics/**"
      - ".github/workflows/revenue-model-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: |
          python -m unittest discover \
            -s projects/sme-revenue-operations-blueprint/analytics \
            -p "test_*.py" -v
      - name: Run sample analysis
        run: |
          python projects/sme-revenue-operations-blueprint/analytics/revenue_model.py
